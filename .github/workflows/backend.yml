name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync backend dependencies
        working-directory: backend
        run: uv sync --group dev --reinstall-package alexandria-hermes

      - name: Run backend static checks
        working-directory: backend
        run: |
          make format_check
          make type_checking
          make guardrails

      - name: Validate Docker Compose graph profile
        run: |
          docker compose config --quiet --no-env-resolution
          docker compose --profile graph config --quiet --no-env-resolution

      - name: Run Neo4j graph focused contracts
        working-directory: backend
        run: |
          uv run --no-editable pytest -q \
            tests/platform/test_app_config.py \
            tests/platform/test_compose_backend_process_contract.py \
            tests/platform/test_compose_neo4j_profile_contract.py \
            tests/obsidian/graph \
            tests/memory/interface/test_context_router.py \
            tests/memory/test_context_service_provider_mode.py \
            tests/memory/test_graph_aware_context_retrieval.py
