services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    env_file:
      - ./.env
    environment:
      PYTHONUNBUFFERED: "1"
      SERVICE_ALEXANDRIA_OBSIDIAN_ROOT: "."
      SERVICE_MEMORY_COMPACT_NOTE_DIR: "Memory Compacts"
      SERVICE_OBSIDIAN_VAULT_PATH: /vault
      SERVICE_RAG_EMBEDDING_CACHE_DIR: /app/data/fastembed-cache
      SERVICE_RAG_EMBEDDING_RECOVERY_ON_STARTUP: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/pyproject.toml:/app/pyproject.toml:ro
      - ./backend/uv.lock:/app/uv.lock:ro
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - ./backend/app:/app/app:ro
      - ./backend/migrations:/app/migrations:ro
      - ./backend/tests:/app/tests:ro
      - ./backend/data:/app/data
      - ${ALEXANDRIA_HOST_OBSIDIAN_VAULT_PATH:-${HOME}/Desktop/Alexandria}:/vault
    restart: unless-stopped
